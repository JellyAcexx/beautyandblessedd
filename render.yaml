services:
  - type: web
    name: bblessed-php
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: u937180775_bblessed_db
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
