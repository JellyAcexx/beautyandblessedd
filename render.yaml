services:
  - type: web
    name: bblessed-php
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
