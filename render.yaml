services:
  - type: web
    name: bblessed-php
    runtime: docker
    plan: free
    envVars:
      - key: PORT
        value: 10000
      # Required: paste the Supabase Session Pooler connection string in Render.
      - key: SUPABASE_DB_URL
        sync: false
      # Optional fallback if not using SUPABASE_DB_URL.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: postgres
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Optional Supabase API settings.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
